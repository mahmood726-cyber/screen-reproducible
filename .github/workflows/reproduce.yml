name: reproduce

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: "full = every number in the paper (about 1-2 h); quick = smoke run"
        type: choice
        options: [full, quick]
        default: full

permissions:
  contents: read

jobs:
  quick:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'quick'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13.13"
          cache: pip
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - run: python -m pip install -r requirements.txt
      - run: python reproduce.py --quick
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: quick-${{ matrix.os }}
          path: |
            outputs/quick
            results/quick
          if-no-files-found: warn

  docker:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -t screen-reproducible .
      - run: mkdir -p outputs && docker run --rm -v "$PWD/outputs:/work/outputs" screen-reproducible --quick

  full:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13.13"
          cache: pip
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - run: python -m pip install -r requirements.txt
      - run: python reproduce.py
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: full-run-outputs
          path: |
            outputs/full
            results/full
          if-no-files-found: warn

  full-docker:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -t screen-reproducible .
      - run: |
          mkdir -p outputs results
          docker run --rm -v "$PWD/outputs:/work/outputs" -v "$PWD/results:/work/results" screen-reproducible --full
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: full-docker-outputs
          path: |
            outputs/full
            results/full
          if-no-files-found: warn

  compare:
    # The canonical (Docker) run and the native run must be bit-identical.
    if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
    needs: [full, full-docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: full-docker-outputs
          path: docker
      - uses: actions/download-artifact@v8.0.1
        with:
          name: full-run-outputs
          path: native
      - run: python analysis/compare_runs.py docker/results/full native/results/full
