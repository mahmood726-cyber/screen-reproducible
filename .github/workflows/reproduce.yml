name: reproduce

# push / pull_request: quick run on Linux, Windows, macOS and Docker.
# workflow_dispatch (Actions -> reproduce -> Run workflow; in a fork, after enabling Actions):
#   mode=full  every number in the paper on all four platforms (about 20-40 min per platform) + bit-identity check
#   mode=quick the quick run only
# Each run writes its PASS/FAIL report to the job summary and as an artefact (reproduction-report-*); on this
# repository's main branch the latest quick and latest full reports are published to GitHub Pages.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: "full = every number in the paper (about 20-40 min per platform); quick = smoke run"
        type: choice
        options: [full, quick]
        default: full
      protocol:
        description: "benchmark protocol for a full run: v1.0.1 (default) or v1.0.0 (the paper's numbers); quick runs always run both"
        type: choice
        options: [v1.0.1, v1.0.0]
        default: v1.0.1
      platforms:
        description: "full run on all = Docker + Linux + Windows + macOS with the bit-identity check; docker = the canonical Docker run only"
        type: choice
        options: [all, docker]
        default: all

permissions:
  contents: read

jobs:
  quick:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'quick'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13.13"
          cache: pip
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - run: python -m pip install -r requirements.txt
      - name: quick run, protocol v1.0.0 (the paper's protocol)
        run: python reproduce.py --quick --protocol v1.0.0
      - name: quick run, protocol v1.0.1
        if: always()
        run: python reproduce.py --quick --protocol v1.0.1
      - name: PASS/FAIL report to the job summary
        if: always()
        shell: bash
        run: |
          for p in v1.0.0 v1.0.1; do
            f=outputs/$p/quick/reproduction_report.md
            if [ -f "$f" ]; then { echo "## ${{ matrix.os }}: quick run, protocol $p"; tail -n +2 "$f"; } >> "$GITHUB_STEP_SUMMARY"; else echo "## ${{ matrix.os }}: quick run ($p) produced no report" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reproduction-report-quick-${{ matrix.os }}
          path: |
            outputs/*/quick/reproduction_report.md
            outputs/*/quick/reproduction_report.json
            outputs/*/quick/stats.json
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: quick-${{ matrix.os }}
          path: |
            outputs/*/quick
            results/*/quick
          if-no-files-found: warn

  docker:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'quick'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -t screen-reproducible .
      - name: quick run, protocol v1.0.0 (the paper's protocol)
        run: mkdir -p outputs results && docker run --rm -v "$PWD/outputs:/work/outputs" -v "$PWD/results:/work/results" screen-reproducible --quick --protocol v1.0.0
      - name: quick run, protocol v1.0.1
        if: always()
        run: docker run --rm -v "$PWD/outputs:/work/outputs" -v "$PWD/results:/work/results" screen-reproducible --quick --protocol v1.0.1
      - name: PASS/FAIL report to the job summary
        if: always()
        run: |
          for p in v1.0.0 v1.0.1; do
            f=outputs/$p/quick/reproduction_report.md
            if [ -f "$f" ]; then { echo "## Docker (canonical): quick run, protocol $p"; tail -n +2 "$f"; } >> "$GITHUB_STEP_SUMMARY"; else echo "## Docker: quick run ($p) produced no report" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reproduction-report-quick-docker
          path: |
            outputs/*/quick/reproduction_report.md
            outputs/*/quick/reproduction_report.json
            outputs/*/quick/stats.json
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: quick-docker
          path: |
            outputs/*/quick
            results/*/quick
          if-no-files-found: warn

  full:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full' && inputs.platforms == 'all'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13.13"
          cache: pip
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - run: python -m pip install -r requirements.txt
      - run: python reproduce.py --protocol ${{ inputs.protocol }}
      - name: PASS/FAIL report to the job summary
        if: always()
        shell: bash
        run: |
          f=outputs/${{ inputs.protocol }}/full/reproduction_report.md
          if [ -f "$f" ]; then { echo "## ${{ matrix.os }}: full run, protocol ${{ inputs.protocol }}"; tail -n +2 "$f"; } >> "$GITHUB_STEP_SUMMARY"; else echo "## ${{ matrix.os }}: full run produced no report" >> "$GITHUB_STEP_SUMMARY"; fi
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reproduction-report-full-${{ matrix.os }}
          path: |
            outputs/${{ inputs.protocol }}/full/reproduction_report.md
            outputs/${{ inputs.protocol }}/full/reproduction_report.json
            outputs/${{ inputs.protocol }}/full/stats.json
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: full-run-outputs-${{ matrix.os }}
          path: |
            outputs/${{ inputs.protocol }}/full
            results/${{ inputs.protocol }}/full
          if-no-files-found: warn

  full-docker:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -t screen-reproducible .
      - run: |
          mkdir -p outputs results
          docker run --rm -v "$PWD/outputs:/work/outputs" -v "$PWD/results:/work/results" screen-reproducible --full --protocol ${{ inputs.protocol }}
      - name: PASS/FAIL report to the job summary
        if: always()
        run: |
          f=outputs/${{ inputs.protocol }}/full/reproduction_report.md
          if [ -f "$f" ]; then { echo "## Docker (canonical): full run, protocol ${{ inputs.protocol }}"; tail -n +2 "$f"; } >> "$GITHUB_STEP_SUMMARY"; else echo "## Docker: full run produced no report" >> "$GITHUB_STEP_SUMMARY"; fi
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reproduction-report-full-docker
          path: |
            outputs/${{ inputs.protocol }}/full/reproduction_report.md
            outputs/${{ inputs.protocol }}/full/reproduction_report.json
            outputs/${{ inputs.protocol }}/full/stats.json
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: full-docker-outputs
          path: |
            outputs/${{ inputs.protocol }}/full
            results/${{ inputs.protocol }}/full
          if-no-files-found: warn

  compare:
    # The canonical (Docker) run and the native runs on Linux, Windows and macOS must be bit-identical.
    if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'full' && inputs.platforms == 'all'
    needs: [full, full-docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          path: runs
      - shell: bash
        run: |
          set -o pipefail
          ls runs
          { echo '## Cross-platform comparison'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          P=${{ inputs.protocol }}
          python analysis/compare_runs.py runs/full-docker-outputs/results/$P/full runs/full-run-outputs-ubuntu-latest/results/$P/full runs/full-run-outputs-windows-latest/results/$P/full runs/full-run-outputs-macos-latest/results/$P/full | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  publish:
    # Live results page: https://mahmood726-cyber.github.io/screen-reproducible/ (latest full run and latest quick run).
    # Only on this repository's main branch (forks and pull requests skip it).
    if: always() && github.repository_owner == 'mahmood726-cyber' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [quick, docker, full, full-docker, compare]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-results
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          path: runs
      - name: Update the gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'full' }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" gh-pages >/dev/null; then
            git clone --quiet --depth 1 --branch gh-pages "$url" pub
          else
            mkdir pub && git -C pub init --quiet -b gh-pages && git -C pub remote add origin "$url"
          fi
          if [ "$FULL" = "true" ]; then
            args=(--mode full --canonical full-docker-outputs --platform "Docker (canonical)=full-docker-outputs"
                  --platform "Linux=full-run-outputs-ubuntu-latest" --platform "Windows=full-run-outputs-windows-latest"
                  --platform "macOS=full-run-outputs-macos-latest" --compare "${{ needs.compare.result }}"
                  --protocol "${{ inputs.protocol }}"
                  --mode-note "Full run, protocol ${{ inputs.protocol }} (v1.0.0 = every number in the paper; started from Actions -> Run workflow, mode full).")
          else
            args=(--mode quick --canonical quick-docker --platform "Docker (canonical)=quick-docker"
                  --platform "Linux=quick-ubuntu-latest" --platform "Windows=quick-windows-latest" --platform "macOS=quick-macos-latest"
                  --protocol v1.0.1
                  --mode-note "Quick run (4 small datasets, 1 seed), protocol v1.0.1, run on every push (protocol v1.0.0 runs too; see the job summaries).")
          fi
          python3 ci/build_site.py --runs runs --site pub "${args[@]}" \
            --title "Screen: reproducible benchmark" \
            --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --links "Paper archive (Zenodo)=https://doi.org/10.5281/zenodo.23132680" \
            --links "Live app=https://mahmood726-cyber.github.io/allmeta/screen/"
          cd pub
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Results of run ${GITHUB_RUN_ID} (${GITHUB_SHA::7})" && git push --quiet origin gh-pages
          echo "Published: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_STEP_SUMMARY"
